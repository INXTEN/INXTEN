<svg width="720" height="420" viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mona style character banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#1f1147"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="720" height="420" rx="24" fill="url(#bg)"/>
  <circle cx="615" cy="72" r="28" fill="#22d3ee" opacity="0.30" filter="url(#glow)"/>
  <circle cx="90" cy="330" r="38" fill="#a78bfa" opacity="0.22" filter="url(#glow)"/>

  <text x="42" y="64" fill="#c7d2fe" font-size="26" font-family="Segoe UI, sans-serif" font-weight="700">INXTEN • Creative SVG</text>

  <!-- character -->
  <ellipse cx="360" cy="210" rx="126" ry="116" fill="url(#hair)"/>
  <circle cx="360" cy="206" r="84" fill="#f8c9ab"/>

  <!-- bangs -->
  <path d="M280 184 C300 120, 420 120, 440 184 C415 156, 305 156, 280 184Z" fill="#0f172a"/>
  <path d="M300 155 C330 128, 390 128, 420 155 C390 145, 330 145, 300 155Z" fill="#1e1b4b"/>

  <!-- eyes -->
  <ellipse cx="330" cy="205" rx="16" ry="12" fill="#fff"/>
  <ellipse cx="390" cy="205" rx="16" ry="12" fill="#fff"/>
  <circle cx="333" cy="206" r="6" fill="#111827"/>
  <circle cx="393" cy="206" r="6" fill="#111827"/>
  <circle cx="336" cy="203" r="2" fill="#93c5fd"/>
  <circle cx="396" cy="203" r="2" fill="#93c5fd"/>

  <!-- cheeks + mouth -->
  <ellipse cx="304" cy="230" rx="10" ry="5" fill="#fb7185" opacity="0.45"/>
  <ellipse cx="416" cy="230" rx="10" ry="5" fill="#fb7185" opacity="0.45"/>
  <path d="M344 243 Q360 255 376 243" stroke="#7c2d12" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- hoodie -->
  <path d="M235 360 C255 296, 300 276, 360 276 C420 276, 465 296, 485 360 Z" fill="url(#hoodie)"/>
  <path d="M305 280 C318 312, 402 312, 415 280" stroke="#dbeafe" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/>
  <circle cx="334" cy="326" r="5" fill="#ecfeff"/>
  <circle cx="386" cy="326" r="5" fill="#ecfeff"/>

  <text x="42" y="372" fill="#e2e8f0" font-size="20" font-family="Segoe UI, sans-serif">"Build • Learn • Shine"</text>
</svg>
